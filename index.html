<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mood News</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card: #fff; --primary: #007bff; }
        body.optimistic { --bg: #e8f5e9; --text: #1b5e20; --primary: #4caf50; }
        body.sad { --bg: #eceff1; --text: #37474f; --primary: #607d8b; }
        body.ironic { --bg: #f3e5f5; --text: #4a148c; --primary: #9c27b0; }

        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .active-btn { background: var(--primary); color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; color: #333; }
        .card:hover { transform: translateY(-5px); }
        .date { font-size: 0.8em; color: gray; }
        .source-link { display: inline-block; margin-top: 10px; color: var(--primary); text-decoration: none; font-size: 0.9em;}

        /* Модальное окно */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal { background: white; padding: 30px; border-radius: 10px; max-width: 800px; width: 90%; display: flex; gap: 20px; color: #333;}
        .modal-half { flex: 1; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 24px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Адаптивные Новости</h1>
    <div class="controls">
        <button onclick="changeMood('neutral')" id="btn-neutral" class="active-btn">Нейтрально (Оригинал)</button>
        <button onclick="changeMood('optimistic')" id="btn-optimistic">Радостно</button>
        <button onclick="changeMood('sad')" id="btn-sad">Грустно</button>
        <button onclick="changeMood('ironic')" id="btn-ironic">Иронично</button>
    </div>

    <div class="grid" id="news-grid"></div>

    <!-- Модальное окно для сравнения -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <span class="close-btn">&times;</span>
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-half">
                <h3>Оригинал</h3>
                <p id="modal-original"></p>
            </div>
            <div class="modal-half">
                <h3 id="modal-mood-title">Переписано</h3>
                <p id="modal-rewritten"></p>
            </div>
        </div>
    </div>

    <script>
        let currentMood = 'neutral';
        let newsData = [];

        // Загрузка базы данных
        fetch('news_data.json')
            .then(res => res.json())
            .then(data => {
                newsData = data;
                renderGrid();
            });

        function changeMood(mood) {
            currentMood = mood;
            document.body.className = mood !== 'neutral' ? mood : '';
            
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active-btn'));
            document.getElementById(`btn-${mood}`).classList.add('active-btn');
            
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';
            
            newsData.forEach((news, index) => {
                const text = news.moods[currentMood];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="date">${new Date(news.published).toLocaleDateString()}</div>
                    <h3>${news.title}</h3>
                    <p>${text.substring(0, 150)}...</p>
                    <a href="${news.link}" target="_blank" class="source-link" onclick="event.stopPropagation()">Читать источник ↗</a>
                `;
                // По клику открываем сравнение
                card.onclick = () => openModal(index);
                grid.appendChild(card);
            });
        }

        function openModal(index) {
            const news = newsData[index];
            document.getElementById('modal-original').innerText = news.original_text;
            document.getElementById('modal-rewritten').innerText = news.moods[currentMood];
            document.getElementById('modal-mood-title').innerText = `Версия: ${currentMood}`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal(e) {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
