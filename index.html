<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Mood News</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <h1 style="text-align: center">Адаптивные Новости</h1>
    <div class="controls">
      <button
        onclick="changeMood('neutral')"
        id="btn-neutral"
        class="active-btn"
      >
        Нейтрально (Оригинал)
      </button>
      <button onclick="changeMood('optimistic')" id="btn-optimistic">
        Радостно
      </button>
      <button onclick="changeMood('sad')" id="btn-sad">Грустно</button>
      <button onclick="changeMood('ironic')" id="btn-ironic">Иронично</button>
    </div>

    <div class="grid" id="news-grid"></div>

    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
      <span class="close-btn">&times;</span>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-half">
          <h3>Оригинал</h3>
          <p id="modal-original"></p>
        </div>
        <div class="modal-half">
          <h3 id="modal-mood-title"></h3>
          <p id="modal-rewritten"></p>
        </div>
      </div>
    </div>
  </body>
</html>
